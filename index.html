<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Керей Style — кәсіптік бағдар</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Noto+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3f6;--ink:#10263a;--mut:#4d6173;--card:#fff;--line:#d3dee6;--acc:#1b6f93;--gold:#e3a72f;--hero:#10263a;--herotxt:#f2f6f9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a26;--ink:#e8eff4;--mut:#9fb3c2;--card:#142535;--line:#25394b;--acc:#62bde0;--hero:#081018;--herotxt:#f2f6f9}}
:root[data-theme="dark"]{--bg:#0d1a26;--ink:#e8eff4;--mut:#9fb3c2;--card:#142535;--line:#25394b;--acc:#62bde0;--hero:#081018;--herotxt:#f2f6f9}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 "Noto Sans",system-ui,sans-serif}
h1,h2,h3,.brand{font-family:Montserrat,"Noto Sans",system-ui,sans-serif;line-height:1.15;margin:0}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hero);color:var(--herotxt);display:flex;align-items:center;gap:16px;padding:10px 16px}
.brand{font-weight:800;font-size:19px;white-space:nowrap}.brand b{color:var(--gold)}
nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
nav a{color:var(--herotxt);text-decoration:none;padding:6px 12px;border-radius:99px;font-size:14px;white-space:nowrap}
nav a:hover{background:rgba(255,255,255,.12)}
.hero{background:var(--hero);color:var(--herotxt);padding:clamp(48px,10vw,110px) 20px clamp(56px,10vw,120px);position:relative;overflow:hidden}
.hero svg{position:absolute;right:-40px;bottom:-30px;width:min(440px,70%);opacity:.14;color:var(--gold)}
.wrap{max-width:1040px;margin:0 auto;position:relative}
.hero h1{font-weight:800;font-size:clamp(34px,7vw,72px);max-width:13em}
.hero p{max-width:34em;font-size:clamp(16px,2.4vw,20px);color:#c9d7e2;margin:22px 0 30px}
.btn{display:inline-block;background:var(--gold);color:#10263a;font:700 15px Montserrat,sans-serif;padding:13px 24px;border-radius:10px;text-decoration:none;border:0;cursor:pointer}
.btn.alt{background:transparent;color:inherit;border:2px solid currentColor}
section{padding:clamp(44px,7vw,84px) 20px}
h2{font-size:clamp(26px,4vw,38px);margin-bottom:12px}
.lead{color:var(--mut);max-width:42em;margin:0 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;position:relative}
.card h3{font-size:18px;margin-bottom:8px}.card p{margin:0;color:var(--mut);font-size:15px}
.about{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media(min-width:760px){.about{grid-template-columns:260px minmax(0,1fr)}}
.ava{aspect-ratio:1;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--hero));display:grid;place-items:center;color:#fff;font:800 72px Montserrat,sans-serif}
.ava{overflow:hidden}.ava img{width:100%;height:100%;object-fit:cover;display:block}
.who{font-size:13px;color:var(--acc);font-weight:600;margin-bottom:6px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:48px 1fr;gap:14px;padding:18px 0;border-top:1px solid var(--line)}
.steps li:before{content:counter(s);width:40px;height:40px;border-radius:50%;background:var(--gold);color:#10263a;display:grid;place-items:center;font:800 17px Montserrat,sans-serif}
.steps h3{font-size:18px;margin-bottom:4px}.steps p{margin:0;color:var(--mut)}
.alt-bg{background:var(--card);border-block:1px solid var(--line)}
.date{font-size:13px;color:var(--acc);font-weight:600}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.contact div{border-left:4px solid var(--gold);padding-left:14px}.contact small{display:block;color:var(--mut)}
footer{background:var(--hero);color:#9fb3c2;text-align:center;padding:26px 20px;font-size:14px}
/* edit mode */
.ed{outline:2px dashed var(--gold);outline-offset:3px;border-radius:4px;display:inline-block;min-width:3ch}
.x{position:absolute;top:8px;right:8px;border:0;background:#c0392b;color:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px}
.add{margin-top:14px}
#bar{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);z-index:9;display:flex;gap:8px;justify-content:center;padding:10px;background:rgba(16,38,58,.94);color:#fff}
#bar span{align-self:center;font-size:14px}
.pad{height:70px}
.pcard{padding:0;overflow:hidden;display:flex;flex-direction:column}
.pimg{aspect-ratio:16/10;background:linear-gradient(135deg,var(--acc),var(--hero));display:grid;place-items:center;color:#fff;font:800 40px Montserrat,sans-serif;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pbody{padding:18px 20px 22px}
.pbody .date{margin-bottom:4px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 18px}
.pbtns .btn{margin:0;padding:8px 14px;font-size:13px}
.open{margin-top:14px;padding:9px 16px;font-size:14px}.detail{min-height:70vh}.back{padding:8px 16px;font-size:14px}
.ed:empty:before{content:'Мәтін жазыңыз…';color:var(--mut)}.more{max-width:46em;margin-bottom:6px;white-space:pre-line}
.soc{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.sbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;background:var(--hero);color:var(--herotxt);border:1px solid var(--line);text-decoration:none;font:600 14px "Noto Sans",sans-serif}
.sbtn:hover{background:var(--acc);color:#fff}.sbtn svg{width:18px;height:18px;flex:none}.socedit{font-size:13px;color:var(--mut);margin:12px 0 0;word-break:break-all}
.pctl{padding:0 20px 14px;display:grid;gap:6px}.pctl label{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:8px;font-size:13px;color:var(--mut)}.pctl input{width:100%;accent-color:var(--gold)}
.pimg[data-zoom]{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,12,20,.93);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lbx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#10263a;font-size:26px;line-height:1;cursor:pointer}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}.prow .date{margin:0}
.say{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--acc);border-radius:99px;padding:4px 11px;font:600 12px "Noto Sans",sans-serif;cursor:pointer;flex:none}
.say svg{width:15px;height:15px}.say.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.saynote{font-size:12px;color:var(--mut);margin:0 0 8px}
.enote{font-size:13px;line-height:1.5;color:var(--mut);margin:-18px 0 24px;max-width:46em}
.edugrid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.ecard{display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--gold)}
.ecard h3{font-size:22px}.ecard .go{margin-top:14px;align-self:flex-start}
.ecard .soon{margin-top:14px;font-size:14px;color:var(--mut)}
#parents .grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.bsearch{width:100%;max-width:460px;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:400 16px "Noto Sans",system-ui,sans-serif;margin:0 0 18px}
.slist{display:grid;gap:10px}
.sitem{position:relative;display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:14px 16px;font:500 16px/1.35 "Noto Sans",system-ui,sans-serif;cursor:pointer;transition:transform .12s}
.sitem:hover{border-left-color:var(--gold);transform:translateX(3px)}
.scode{font:800 15px Montserrat,sans-serif;color:var(--acc)}
.sgo{color:var(--gold);font-weight:800;font-size:18px}
.sedit{cursor:default;padding-right:52px}.sedit:hover{transform:none}
.sh{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 26px}
.chip{background:var(--hero);color:var(--herotxt);border-radius:99px;padding:6px 14px;font-size:14px}.chip b{color:var(--gold)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.stab{width:100%;border-collapse:collapse;font-size:14px}
.stab th,.stab td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--line)}
.stab th{font:700 13px Montserrat,sans-serif;color:var(--mut);background:var(--bg)}
.stab tr:last-child td{border-bottom:0}.stab td:first-child{font-weight:700}
.sblk{margin-top:28px}.sblk h3{font-size:18px;margin-bottom:10px;color:var(--acc)}.sblk p{margin:0;max-width:46em}
.sal{font:800 clamp(22px,5vw,32px) Montserrat,sans-serif}
.sk{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:k}
.sk li{counter-increment:k;position:relative;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 44px 12px 14px}
.sk li:before{content:counter(k);width:30px;height:30px;border-radius:50%;background:var(--gold);color:#10263a;display:grid;place-items:center;font:800 14px Montserrat,sans-serif}
.scode2{font:800 15px Montserrat,sans-serif;color:var(--gold);margin-top:22px}

</style>

   "t": "Кәсіптік бағдардың тарихы",
   "d": "        •\t1908 жыл — АҚШ-тың Бостон қаласында алғашқы кәсіби бағдар беру бюросы — Vocational Bureau ашылды.\n\t•\tОның негізін қалаған Фрэнк Парсонс (Frank Parsons, 1854–1908) кәсіби бағдар берудің алғашқы ірі теоретигі және негізін салушылардың бірі деп есептеледі.\n\t•\t1909 жылы оның Choosing a Vocation («Мамандық таңдау») атты еңбегі жарық көрді. Онда мамандық таңдауда адамның қабілеті, қызығушылығы мен жеке ерекшеліктерін мамандық талаптарымен сәйкестендіру идеясы ұсынылды.\n\t•\tКейін осы бағыттан кәсіби кеңес беру, мансаптық кеңес беру және қазіргі профориентолог қызметі дамыды.\n",

S.parents.forEach(function(c,i){h+='<div class="card pcard">'+X('parents',i)+'<div class="pimg"'+(!edit&&c.img?' data-zoom="'+i+'" tabindex="0" role="button" aria-label="Үлкейту"':'')+' style="'+fstyle(c)+'">'+(c.img?'<img src="'+c.img+'" alt="" style="'+istyle(c)+'">':'Фото')+'</div>'+(edit?'<div class="pbtns"><button class="btn" data-pick="'+i+'">Фото таңдау</button>'+(c.img?'<button class="btn alt" data-rmimg="'+i+'">Өшіру</button>':'')+'<button class="btn" data-audio="'+i+'">'+(c.audio?'Аудионы ауыстыру':'Аудио қосу')+'</button>'+(c.audio?'<button class="btn alt" data-rmaudio="'+i+'">Аудионы өшіру</button>':'')+'</div>'+(c.img?ctl(c,i):''):'')+'<div class="pbody"><div class="prow"><div class="date">'+T('parents.'+i+'.date')+'</div>'+(!edit?sayBtn(i):'')+'</div><h3>'+T('parents.'+i+'.t')+'</h3><p>'+T('parents.'+i+'.d')+'</p></div></div>'});
h+='</div>'+(edit?'<input type="file" id="pfile" accept="image/*" hidden><input type="file" id="afile" accept="audio/*" hidden><p class="socedit" id="amsg">Аудио: mp3 немесе m4a, 4 МБ-қа дейін.</p>':'')+A('parents','Жазба қосу')+'</div></section>';
h+='<section id="contact"><div class="wrap"><h2>Байланыс</h2><div class="contact" style="margin-top:24px"><div><small>Телефон</small>'+T('contacts.phone')+'</div><div><small>Пошта</small>'+T('contacts.email')+'</div><div><small>Мекенжай</small>'+T('contacts.addr')+'</div><div><small>Қабылдау уақыты</small>'+T('contacts.hours')+'</div></div></div></section>';
}
h+='<footer>© Керей Style · Ф. Оңғарсынова атындағы №77 мектеп-гимназиясы</footer>';
if(owner){h+='<div class="pad"></div><div id="bar">'+(edit?'<span>Өзгерту режимі</span><button class="btn" id="save">Сақтау</button><button class="btn alt" id="cancel">Бас тарту</button>':'<span>Сіз сайт иесісіз</span><button class="btn" id="edit">Өзгерту</button>')+'</div>'}
app.innerHTML=h;bind();
}
function bind(){
app.querySelectorAll('[data-p]').forEach(function(el){el.addEventListener('input',function(){put(el.dataset.p,el.textContent)})});
app.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){get(b.dataset.del).splice(+b.dataset.i,1);render()}});
app.querySelectorAll('[data-add]').forEach(function(b){b.onclick=function(){var k=b.dataset.add;
get(k).push(/\.specs$/.test(k)?{code:'B000',t:'Жаңа мамандық',thr:'',stats:[],desc:'',work:'',sal:'',skills:[]}:/\.stats$/.test(k)?{y:'2025',g:'',max:'',min:'',a:'',r:''}:/\.skills$/.test(k)?'Жаңа қабілет':k==='book'?{t:'Жаңа кітапша',d:'Қысқаша сипаттама.',specs:[]}:/\.cities$/.test(k)?{n:'Жаңа қала',url:''}:k==='edu'?{t:'Жаңа оқу орны',d:'Қысқаша сипаттама.',url:''}:k==='parents'?{date:'Күні',t:'Жаңа тақырып',d:'Мәтінді жазыңыз.',img:''}:k==='news'?{date:'Күні',t:'Жаңа тақырып',d:'Мәтінді жазыңыз.'}:k==='steps'?{t:'Жаңа қадам',d:'Сипаттама.'}:k==='dirs'?{t:'Жаңа бағыт',d:'Сипаттама.',more:'',items:[]}:{t:'Жаңа материал',d:'Қысқаша сипаттама.',url:''});render()}});
app.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){view=+b.dataset.open;render();window.scrollTo(0,0)}});
app.querySelectorAll('[data-bopen]').forEach(function(b){b.onclick=function(){bview=+b.dataset.bopen;sview=-1;render();window.scrollTo(0,0)}});
app.querySelectorAll('[data-sopen]').forEach(function(b){b.onclick=function(){sview=+b.dataset.sopen;render();window.scrollTo(0,0)}});
var bb=document.getElementById('bback');if(bb)bb.onclick=function(){bview=-2;sview=-1;render();window.scrollTo(0,0)};
var sb=document.getElementById('sback');if(sb)sb.onclick=function(){sview=-1;render();window.scrollTo(0,0)};
var bs=document.getElementById('bsearch');if(bs)bs.oninput=function(){var q=bs.value.trim().toLowerCase(),n=0;app.querySelectorAll('#slist .sitem').forEach(function(el){var ok2=!q||(el.dataset.q||'').indexOf(q)>-1;el.style.display=ok2?'':'none';if(ok2)n++});document.getElementById('bcount').textContent=n+' мамандық';document.getElementById('bnone').hidden=n>0};
app.querySelectorAll('[data-eopen]').forEach(function(b){b.onclick=function(){eview=+b.dataset.eopen;render();window.scrollTo(0,0)}});
var eb=document.getElementById('eback');if(eb)eb.onclick=function(){eview=-1;render();var el=document.getElementById('edu');if(el)el.scrollIntoView()};
var bk=document.getElementById('back');if(bk)bk.onclick=function(){view=-1;render();var el=document.getElementById('dirs');if(el)el.scrollIntoView()};
var hb=document.getElementById('hback');if(hb)hb.onclick=function(){bview=-1;render();window.scrollTo(0,0)};
app.querySelectorAll('header nav a[href="#book"]').forEach(function(a){a.onclick=function(ev){ev.preventDefault();view=-1;eview=-1;bview=-2;sview=-1;render();window.scrollTo(0,0)}});
if(view>=0||eview>=0||bview!==-1)app.querySelectorAll('header nav a:not([href="#book"])').forEach(function(a){a.onclick=function(ev){ev.preventDefault();var id=a.getAttribute('href').slice(1);view=-1;eview=-1;bview=-1;sview=-1;render();var el=document.getElementById(id);if(el)el.scrollIntoView()}});
var pk=document.getElementById('pick'),pf=document.getElementById('photo'),rp=document.getElementById('rmphoto');
if(pk)pk.onclick=function(){pf.click()};
if(rp)rp.onclick=function(){S.about.photo='';render()};
if(pf)pf.onchange=function(){var f=pf.files[0];if(!f)return;var img=new Image(),u=URL.createObjectURL(f);
img.onload=function(){var n=640,w=img.width,h=img.height,m=Math.min(w,h),cv=document.createElement('canvas');cv.width=cv.height=n;
cv.getContext('2d').drawImage(img,(w-m)/2,(h-m)/2,m,m,0,0,n,n);S.about.photo=cv.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);render()};
img.src=u};
var pfile=document.getElementById('pfile'),cur=-1;
app.querySelectorAll('[data-pick]').forEach(function(b){b.onclick=function(){cur=+b.dataset.pick;pfile.click()}});
app.querySelectorAll('[data-rmimg]').forEach(function(b){b.onclick=function(){S.parents[+b.dataset.rmimg].img='';render()}});
if(pfile)pfile.onchange=function(){var f=pfile.files[0];if(!f||cur<0)return;var img=new Image(),u=URL.createObjectURL(f),k=cur;
img.onload=function(){var w=img.width,h=img.height,s=Math.min(1,1400/Math.max(w,h)),W=Math.round(w*s),H=Math.round(h*s),cv=document.createElement('canvas');cv.width=W;cv.height=H;
cv.getContext('2d').drawImage(img,0,0,W,H);var c=S.parents[k];c.img=cv.toDataURL('image/jpeg',.8);c.x=50;c.y=50;c.z=100;c.h=125;URL.revokeObjectURL(u);render()};
img.src=u};
app.querySelectorAll('.pctl input').forEach(function(r){r.oninput=function(){var c=S.parents[+r.dataset.k];c[r.dataset.f]=+r.value;var card=r.closest('.pcard'),fr=card.querySelector('.pimg'),im=fr.querySelector('img');fr.style.cssText=fstyle(c);if(im)im.style.cssText=istyle(c)}});
app.querySelectorAll('[data-zoom]').forEach(function(el){var go=function(){var c=S.parents[+el.dataset.zoom];if(c&&c.img)openLb(c.img)};el.onclick=go;el.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go()}}});
app.querySelectorAll('[data-say]').forEach(function(b){b.onclick=function(){say(b,S.parents[+b.dataset.say])}});
var afile=document.getElementById('afile'),acur=-1;
app.querySelectorAll('[data-audio]').forEach(function(b){b.onclick=function(){acur=+b.dataset.audio;afile.click()}});
app.querySelectorAll('[data-rmaudio]').forEach(function(b){b.onclick=function(){S.parents[+b.dataset.rmaudio].audio='';render()}});
if(afile)afile.onchange=function(){var f=afile.files[0],m=document.getElementById('amsg');if(!f||acur<0)return;var k=acur;
if(f.size>4*1024*1024){m.textContent='Файл тым үлкен (4 МБ-тан аспауы керек). Қысқарақ немесе жеңілірек файл таңда.';return}
var r=new FileReader();r.onload=function(){S.parents[k].audio=r.result;render()};r.onerror=function(){m.textContent='Файлды оқи алмадым, басқа файл таңдап көр.'};
r.readAsDataURL(new Blob([f],{type:f.type||'audio/mpeg'}))};
var e=document.getElementById('edit'),s=document.getElementById('save'),c=document.getElementById('cancel');
if(e)e.onclick=function(){snap=JSON.stringify(S);edit=true;render()};
if(c)c.onclick=function(){S=JSON.parse(snap);edit=false;render()};
if(s)s.onclick=save;
}
async function save(){
var b=document.getElementById('save');b.textContent='Сақталуда…';
try{
var a=await window.claude.use('artifact');
var cl=document.documentElement.cloneNode(true);
cl.querySelector('#app').innerHTML='';
cl.querySelector('#data').textContent=JSON.stringify(S,null,1).replace(/</g,'\\u003c');
await a.publish('<!DOCTYPE html>\n'+cl.outerHTML);
}catch(err){b.textContent='Қате: қайта көріңіз';console.error(err)}
}
render();
(async function(){try{if(window.claude){var u=await window.claude.use('user');if(u&&u.isOwner()){owner=true;render()}}}catch(e){}})();
</script>
